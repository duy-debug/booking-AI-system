services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build: ./booking-ai-system-be
    ports:
      - "8000:8000"
    env_file: ./booking-ai-system-be/.env
    restart: unless-stopped

  chatbot:
    build: ./booking-ai-chatbot/backend
    ports:
      - "8001:8001"
    env_file: ./booking-ai-chatbot/backend/.env
    depends_on:
      backend:
        condition: service_started
      qdrant:
        condition: service_started
    environment:
      QDRANT_HOST: qdrant
      BOOKING_API_URL: http://backend:8000
      LOG_FILE: /app/logs/chatbot.log
    volumes:
      - ./booking-ai-chatbot/backend/logs:/app/logs
    restart: unless-stopped

  chatbot-frontend:
    build: ./booking-ai-chatbot/frontend
    ports:
      - "3002:3000"
    environment:
      CHATBOT_API_URL: http://chatbot:8001
    depends_on:
      chatbot:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./booking-ai-system-fe
      args:
        - NEXT_PUBLIC_SUPABASE_URL
        - NEXT_PUBLIC_SUPABASE_ANON_KEY
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:

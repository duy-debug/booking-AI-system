services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./booking-ai-system-be
    ports:
      - "8000:8000"
    env_file: ./booking-ai-system-be/.env
    restart: unless-stopped

  chatbot:
    build: ./booking-ai-chatbot/backend
    ports:
      - "8001:8000"
    env_file: ./booking-ai-chatbot/backend/.env
    depends_on:
      backend:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      BOOKING_API_URL: http://backend:8000
    restart: unless-stopped

  frontend:
    build:
      context: ./booking-ai-system-fe
      args:
        - NEXT_PUBLIC_SUPABASE_URL
        - NEXT_PUBLIC_SUPABASE_ANON_KEY
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
